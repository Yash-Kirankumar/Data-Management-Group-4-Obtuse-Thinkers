# TabPy settings for the Tableau Prep Script steps (used by tools/run_tabpy_local.py)
[TabPy]
TABPY_PORT = 9004
# Prep sends all ~1 million sales lines at once (about 230 MB of JSON); default limit is 100 MB
TABPY_MAX_REQUEST_SIZE_MB = 1024
# seconds a Script step may run
TABPY_EVALUATE_TIMEOUT = 900
